# Production on one host: Caddy terminates TLS, the API runs the image from ECR, Postgres keeps its data in a volume.
# deploy.sh writes the .env next to this file and runs it; see infra/README.md.
name: chatquiry

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatquiry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: chatquiry
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only, so the serving data can be loaded through a Session Manager port forward.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatquiry"]
      interval: 5s
      retries: 20

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CQ_ENV: prod
      CQ_DATABASE_URL: postgresql+asyncpg://chatquiry:${POSTGRES_PASSWORD}@db:5432/chatquiry
      CQ_JWT_SECRET: ${JWT_SECRET:?}
      CQ_SEED_ON_START: "1"
      CQ_SEED_PASSWORD: ${SEED_PASSWORD:?}
      CQ_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CQ_GUARDRAIL_ID: ${GUARDRAIL_ID:-}
      CQ_GUARDRAIL_VERSION: ${GUARDRAIL_VERSION:-DRAFT}
      # Without a key the intake falls back to the keyword rules.
      CQ_TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      CQ_CUSTOMER_ASSERTION_PUBLIC_KEY: ${CUSTOMER_ASSERTION_PUBLIC_KEY:-}
      CQ_EVAL_RESULTS: /eval/latest.json
    volumes:
      - ../eval/results:/eval:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
