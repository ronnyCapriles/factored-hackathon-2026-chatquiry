# Amplify Hosting build for the frontend; the app is connected to this repository with frontend/ as its root.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            # Console variables reach the build only; the server runtime reads them from .env.production.
            - env | grep -E '^(CHATQUIRY_API_MODE|CHATQUIRY_API_URL|SESSION_SECRET)=' > .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
