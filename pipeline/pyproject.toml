[project]
name = "chatquiry-pipeline"
version = "0.1.0"
description = "Bronze, silver and gold layers for the Chatquiry serving data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
cq-pipeline = "chatquiry_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatquiry_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long SQL and report prose are string literals; the formatter handles code width.
ignore = ["E501"]
