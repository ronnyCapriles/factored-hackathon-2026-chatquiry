name: deploy

# The backend deploys after its checks pass on main. Amplify builds the frontend on every push by itself;
# running this by hand redeploys either or both without a push.
on:
  workflow_run:
    workflows: [backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, backend, frontend]
        default: both

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NAME: chatquiry-prod
  API_URL: https://api.chatquiry.com

jobs:
  backend:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.target != 'frontend'))
    # Native arm64, the host's architecture, so the image builds without emulation.
    runs-on: ubuntu-24.04-arm
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the API image
        run: |
          image="${{ steps.ecr.outputs.registry }}/$NAME-api:${SHA::7}"
          docker build --target prod -t "$image" backend
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy on the host
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          # The checkout moves to the same commit as the image, so deploy.sh and the compose file match it.
          script="cd /opt/chatquiry && git fetch --quiet origin && git reset --quiet --hard $SHA && API_IMAGE=$IMAGE ./deploy/deploy.sh"
          command=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" --parameters "$(jq -n --arg c "$script" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success
      - name: Check the API answers
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$API_URL/health"

  frontend:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && inputs.target != 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and deploy main on Amplify
        run: |
          app=$(aws amplify list-apps --query "apps[?name=='${{ github.event.repository.name }}'].appId | [0]" --output text)
          job=$(aws amplify start-job --app-id "$app" --branch-name main --job-type RELEASE --query jobSummary.jobId --output text)
          for _ in $(seq 1 90); do
            status=$(aws amplify get-job --app-id "$app" --branch-name main --job-id "$job" --query job.summary.status --output text)
            echo "$status"
            case "$status" in SUCCEED) exit 0 ;; FAILED|CANCELLED) exit 1 ;; esac
            sleep 10
          done
          exit 1
